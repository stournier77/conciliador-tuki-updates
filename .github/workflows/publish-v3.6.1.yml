name: Publish IATA v3.6.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v3.6.1.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 632e843381bf9233898875181d3dcb0dc4d8af7d
          persist-credentials: false
      - name: Verify exact release assets
        run: |
          echo '0564883521c0624842629783a568aac9f4b939d751adab4f2b6359049dbb6d63  latest_pc.zip' | sha256sum -c -
          echo '2edc6f3031abab0136104d9efb6cdbe56dd37131a96320657beb4566be1cb62d  latest_mac.zip' | sha256sum -c -
          echo 'ab42d7a016aac35f4f8bd4f0456a2605f216187d355495a0dfab6b99e19b137d  version.txt' | sha256sum -c -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.txt <<'NOTES'
          Fecha: 02oct2026.
          Corrige la deteccion del UUID en Windows mediante PowerShell/CIM, con WMIC como respaldo.
          Conserva el UUID autorizado de Karen y toda la logica de conciliacion de v3.6.
          NOTES
          gh release create v3.6.1 latest_pc.zip latest_mac.zip version.txt --target 632e843381bf9233898875181d3dcb0dc4d8af7d --title v3.6.1 --notes-file release-notes.txt --latest
