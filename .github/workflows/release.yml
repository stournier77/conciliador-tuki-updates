name: Publicar actualización Mac y Windows
on:
  push:
    branches: [main]
    paths-ignore: ['updates/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-sevens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar y validar paquetes compatibles
        run: python launchers/Preparar_publicacion.py build
      - name: Leer versión
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publicar actualización
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Conciliador IATA ${{ steps.version.outputs.value }} · 27/10/2026
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Corrige la lectura de importes positivos EMDS/EMDA cuando la búsqueda desplazada recorta dígitos del campo completo.
            Evita conciliar por error contra el importe recortado. Conserva las reglas de los demás documentos y las tolerancias existentes.
            Validado con comparación completa de la semana y pruebas Mac/Windows. No modifica el acceso de escritorio.
          files: |
            build/latest_mac.zip
            build/latest_pc.zip
            build/version.txt
