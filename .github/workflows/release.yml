name: Publicar actualización Mac y Windows
on:
  push:
    branches: [main]
    paths-ignore: ['updates/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-sevens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar y validar paquetes compatibles
        run: python launchers/Preparar_publicacion.py build
      - name: Leer versión
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publicar actualización
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Conciliador IATA ${{ steps.version.outputs.value }} · 20/10/2026
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Repara el acceso de Mac con lanzador nativo universal. Prepara el bundle fuera de carpetas sincronizadas y renueva el acceso sin borrarlo ni moverlo primero, con respaldo y firma verificada. Conserva la carga Windows y el motor de conciliacion.
            Mismos accesos de escritorio en Mac y Windows, actualización automática, reapertura de la ventana y resultados en Documentos.
            Incluye migración automática desde los actualizadores anteriores. Se conservan los históricos y la configuración local.
          files: |
            build/latest_mac.zip
            build/latest_pc.zip
            build/version.txt
