name: Publicar actualización Mac y Windows
on:
  push:
    branches: [main]
    paths-ignore: ['updates/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-sevens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar y validar paquetes compatibles
        run: python launchers/Preparar_publicacion.py build
      - name: Leer versión
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publicar actualización
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Conciliador IATA ${{ steps.version.outputs.value }} · 23/10/2026
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Conserva los accesos Mac reparados que inician en segundo plano, incluidos los que apuntan a un lanzador fuera de iCloud.
            Evita reemplazar el acceso estable por el lanzador anterior durante una actualización.
            Mantiene el logo y la detección automática del período. Sin cambios en los cálculos.
          files: |
            build/latest_mac.zip
            build/latest_pc.zip
            build/version.txt
