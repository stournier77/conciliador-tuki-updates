name: Publicar actualización Mac y Windows
on:
  push:
    branches: [main]
    paths-ignore: ['updates/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-sevens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar y validar paquetes compatibles
        run: python launchers/Preparar_publicacion.py build
      - name: Leer versión
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publicar actualización
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Conciliador IATA ${{ steps.version.outputs.value }} · 23/10/2026
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Conserva el acceso de escritorio y su icono personalizado en Mac cuando el lanzador, su ruta y el logo ya son correctos.
            Evita reconstruir el bundle de Finder por un cambio de versión de la aplicación.
            Conserva la detección automática del período IATA. Sin cambios en los cálculos.
          files: |
            build/latest_mac.zip
            build/latest_pc.zip
            build/version.txt
