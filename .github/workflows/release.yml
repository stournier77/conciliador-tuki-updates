name: Publicar actualización Mac y Windows
on:
  push:
    branches: [main]
    paths-ignore: ['updates/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-sevens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar y validar paquetes compatibles
        run: python launchers/Preparar_publicacion.py build
      - name: Leer versión
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publicar actualización
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Conciliador IATA ${{ steps.version.outputs.value }} · 05/11/2026
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Corrige la lectura de ACMA mediante el campo total completo del TXT, en lugar de elegir el importe negativo más grande.
            Validación contra la última columna de los PDF IATA y comparación de históricos. Conserva las excepciones manuales y el tratamiento de SPCR, EMD, TKTT, RFND y ADM.
            Sin cambios en tolerancias, accesos de escritorio ni lógica de los demás documentos.
          files: |
            build/latest_mac.zip
            build/latest_pc.zip
            build/version.txt
